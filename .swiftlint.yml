included:
  - Stride
  # Test sources are linted too. The only error-level rule they legitimately break
  # is `identifier_name.min_length` (throwaway `var c` DateComponents builders), so
  # nested `.swiftlint.yml` files in each test directory relax just that rule rather
  # than weakening it for the app.
  - StrideTests
  - StrideUITests

excluded:
  - Stride/Resources

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - multiline_arguments
  - multiline_function_chains
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo                    # TODOs are acceptable during development
  - trailing_whitespace

line_length:
  warning: 120
  error: 350
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  # The largest type is now TrainingPlanService at ~1,000 lines. RunSummaryView was
  # the exception this threshold used to be written around — it is split across
  # `RunSummaryView+*.swift` extensions and no longer carries a disable of either
  # this rule or file_length (D1). The old 2000 error was unreachable (N31).
  error: 1100

file_length:
  warning: 400
  # No file carries a `swiftlint:disable file_length` any more; the previous 2000
  # error was unreachable in practice (N31).
  error: 1500

function_body_length:
  warning: 60
  # StrideIcon.draw — a flat switch of drawing commands, one case per icon — was
  # the only function over 350 and made the lint job fail; it now carries a
  # scoped disable, and the next longest function is ~100 lines (N31).
  error: 150

cyclomatic_complexity:
  warning: 10
  # Worst measured is 33; 80 could never fire (N31).
  error: 40

identifier_name:
  min_length: 2

custom_rules:
  # A `static let caption = Font.system(size: 12)` in a Font extension shadows
  # SwiftUI's own dynamic-type token at every `.font(.caption)` call site in the
  # app — hundreds of them — and silently disables Dynamic Type with no warning
  # from the compiler (N19). Design-system tokens carry a `ds` prefix instead.
  no_builtin_font_shadowing:
    name: "Built-in Font token shadowed"
    regex: 'static\s+(?:let|var)\s+(largeTitle|title|title2|title3|headline|subheadline|body|callout|footnote|caption|caption2)\s*(?::\s*Font\s*)?=\s*Font'
    message: "Don't re-declare one of SwiftUI's Font statics — it shadows the dynamic-type token app-wide. Use a `ds`-prefixed name (see Stride/Shared/Theme/AppFonts.swift)."
    severity: error

  # The `ds*` scale was added to fix Dynamic Type (N19) and then never wired up:
  # 296 call sites kept rendering a fixed point size, so text did not scale
  # anywhere in the app (U2). The migration is done; this keeps it done.
  #
  # A *literal* size is what's banned. `.font(.system(size: badgeSize))` — a size
  # derived from a `@ScaledMetric` or from a caller's parameter — still scales and
  # still passes. The exclusions are the places where a fixed size is the point:
  # the scale's own definitions, the Active Run HUD (AppFonts rule 2), and the
  # share card, which renders a fixed-size PNG.
  no_fixed_font_size:
    name: "Fixed font size"
    regex: '\.font\(\s*\.system\(size:\s*[0-9]'
    excluded:
      - ".*/AppFonts\\.swift"
      - ".*/ActiveRunView\\.swift"
      - ".*/GuidedWorkoutBanner\\.swift"
      - ".*/RunShareCardView\\.swift"
      - ".*/StrideIcon\\.swift"
    message: "Use a design-system font token (`.dsBody`, `.dsCaption2`, …) or a `@ScaledMetric` size. A literal point size ignores the user's preferred content size. See Stride/Shared/Theme/AppFonts.swift."
    severity: error
