included:
  - Stride
  # Test sources are linted too. The only error-level rule they legitimately break
  # is `identifier_name.min_length` (throwaway `var c` DateComponents builders), so
  # nested `.swiftlint.yml` files in each test directory relax just that rule rather
  # than weakening it for the app.
  - StrideTests
  - StrideUITests

excluded:
  - Stride/Resources

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - multiline_arguments
  - multiline_function_chains
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo                    # TODOs are acceptable during development
  - trailing_whitespace

line_length:
  warning: 120
  error: 350
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 2000

file_length:
  warning: 400
  # The only file above this is RunSummaryView.swift, which carries an explicit
  # `swiftlint:disable file_length`; the previous 2000 error was unreachable.
  error: 1500

function_body_length:
  warning: 60
  error: 350

cyclomatic_complexity:
  warning: 10
  error: 80

identifier_name:
  min_length: 2
