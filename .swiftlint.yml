included:
  - Stride
  # NOTE: StrideTests/StrideUITests are intentionally not linted yet — enabling
  # them requires first clearing existing error-level violations in the test
  # sources (e.g. single-character identifiers vs. `identifier_name.min_length`),
  # otherwise the full-tree lint on push would fail.

excluded:
  - Stride/Resources

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - multiline_arguments
  - multiline_function_chains
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo                    # TODOs are acceptable during development
  - trailing_whitespace

line_length:
  warning: 120
  error: 350
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 2000

file_length:
  warning: 400
  # The only file above this is RunSummaryView.swift, which carries an explicit
  # `swiftlint:disable file_length`; the previous 2000 error was unreachable.
  error: 1500

function_body_length:
  warning: 60
  error: 350

cyclomatic_complexity:
  warning: 10
  error: 80

identifier_name:
  min_length: 2
