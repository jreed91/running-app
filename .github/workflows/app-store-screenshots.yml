name: App Store screenshots

# Captures the App Store screenshots from the demo history and frames the iPhone ones
# in the Route Loop style (design/appstore/). Not part of CI: it runs when a pull
# request carries the `app-store-screenshots` label, or by hand from the Actions tab.
# Download the `app-store-screenshots` artifact from the run:
#   iphone-6.9/  framed, 1320 x 2868, for the 6.9" slot in App Store Connect
#   iphone-6.3/  the same, scaled to 1206 x 2622, for the 6.1" / 6.3" slot
#   iphone-raw/  the unframed captures
#   watch/       raw Apple Watch captures (App Store Connect takes them unframed)
# and the `app-store-screenshots-duo` artifact, from its own job:
#   duo-outer/   framed, 1398 x 2034, for the iPhone Duo slot (outer display, portrait)
#   duo-raw/     the unframed captures

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: App Store screenshots
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'app-store-screenshots')
    runs-on: xcode-27
    # Room for the iPhone capture plus a watchOS runtime download.
    timeout-minutes: 100
    env:
      IPHONE: iPhone 17 Pro Max
      RAW: ${{ github.workspace }}/AppStore/iphone-raw
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$XCODE" ]] || { echo "::error::No Xcode 27 on this runner"; exit 1; }
          sudo xcode-select -switch "$XCODE"

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Boot the iPhone simulator at 9:41, in dark appearance
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg name "$IPHONE" '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == $name)] | .[0].udid // empty')
          if [[ -z "$UDID" ]]; then
            echo "::warning::No '$IPHONE' simulator; using the largest available iPhone."
            UDID=$(xcrun simctl list devices available -j \
              | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | test("Pro Max"))] | .[0].udid // empty')
          fi
          [[ -n "$UDID" ]] || { echo "::error::No iPhone simulator found"; xcrun simctl list devices available; exit 1; }
          echo "IPHONE_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # Dark, so the screen matches the night-map frame and the icon
          # (design/route-loop/README.md, "App Store screenshots").
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Capture iPhone screens
        run: |
          set -o pipefail
          mkdir -p "$RAW"
          TEST_RUNNER_APP_STORE_CAPTURE_DIR="$RAW" xcodebuild test \
            -scheme Stride \
            -destination "platform=iOS Simulator,id=$IPHONE_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:StrideUITests/AppStoreScreenshotTests \
            -resultBundlePath AppStore/iphone.xcresult \
            -skipMacroValidation -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          ls -l "$RAW"

      - name: Boot an Apple Watch simulator
        # The runner image lists the watchOS 27.0 runtime as available, and Watch
        # devices on it, but the runtime's files aren't there: booting fails with
        # "The watchOS 27.0 simulator runtime is not available". So a boot is the
        # only real check. If it fails, fetch the runtime for the selected Xcode and
        # try again; if that fails too, skip the Watch with a warning.
        id: watch
        continue-on-error: true
        timeout-minutes: 30
        run: |
          boot_watch() {
            RUNTIME=$(xcrun simctl list runtimes -j \
              | jq -r '[.runtimes[] | select(.platform == "watchOS" and .isAvailable)] | last | .identifier // empty')
            [[ -n "$RUNTIME" ]] || return 1
            DEVICES=$(xcrun simctl list devices available -j | jq --arg rt "$RUNTIME" '.devices[$rt] // []')
            WATCH=$(jq -r '[.[] | select(.name | test("Ultra"))] | .[0].udid // empty' <<<"$DEVICES")
            [[ -n "$WATCH" ]] || WATCH=$(jq -r '.[0].udid // empty' <<<"$DEVICES")
            if [[ -z "$WATCH" ]]; then
              TYPE=$(xcrun simctl list devicetypes -j \
                | jq -r '[.devicetypes[] | select(.productFamily == "Apple Watch" and (.name | test("Ultra")))] | last | .identifier // empty')
              [[ -n "$TYPE" ]] || return 1
              WATCH=$(xcrun simctl create "Apple Watch Ultra (screenshots)" "$TYPE" "$RUNTIME") || return 1
            fi
            xcrun simctl boot "$WATCH" || true   # fails harmlessly when already booted
            xcrun simctl bootstatus "$WATCH" -b || return 1
          }
          if ! boot_watch; then
            echo "The Watch simulator didn't boot; downloading the watchOS runtime."
            if ! xcodebuild -downloadPlatform watchOS || ! boot_watch; then
              echo "::warning::No bootable watchOS simulator on this runner; no Watch screenshots."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "WATCH=$WATCH" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Capture Apple Watch screens
        # Best effort: a hung build or launch times out, and the iPhone set is still
        # framed and uploaded.
        if: steps.watch.outputs.ready == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set -o pipefail
          # No status bar override here: watchOS simulators reject it ("Status bar
          # overrides not supported on this platform"), and the watch face shows the
          # simulator's own clock.
          xcodebuild build \
            -scheme StrideWatch \
            -destination "platform=watchOS Simulator,id=$WATCH" \
            -derivedDataPath DerivedData \
            -skipMacroValidation -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          APP=$(find DerivedData/Build/Products -maxdepth 2 -path '*watchsimulator/StrideWatch.app' | head -1)
          xcrun simctl install "$WATCH" "$APP"
          mkdir -p AppStore/watch
          for entry in "0 01-today" "1 02-week" "2 03-race"; do
            set -- $entry
            xcrun simctl terminate "$WATCH" com.running.stride.watchkitapp 2>/dev/null || true
            xcrun simctl launch "$WATCH" com.running.stride.watchkitapp --seed-demo-data --demo-page "$1"
            sleep 6
            xcrun simctl io "$WATCH" screenshot "AppStore/watch/$2.png"
          done
          ls -l AppStore/watch

      - name: Frame the iPhone screens
        run: |
          cd design/appstore
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install webkit
          node compose.mjs "$RAW" "$GITHUB_WORKSPACE/AppStore/iphone-6.9" webkit

      - name: Scale the framed screens for the 6.1" / 6.3" slot
        # App Store Connect's 6.1"/6.3" slot takes 1206 x 2622 (among others). Same
        # aspect as 1320 x 2868 to within 0.1%, so a straight resize, no re-layout.
        run: |
          mkdir -p AppStore/iphone-6.3
          for f in AppStore/iphone-6.9/*.png; do
            sips -z 2622 1206 "$f" --out "AppStore/iphone-6.3/$(basename "$f")" >/dev/null
          done
          sips -g pixelWidth -g pixelHeight AppStore/iphone-6.3/*.png

      - name: Flatten every screenshot to RGB, no alpha
        # App Store Connect rejects PNGs with an alpha channel (INVALID_ASSET_FILE_FORMAT),
        # and WebKit, sips and the simulator all write RGBA. Pillow drops the alpha onto
        # the night-map colour (nothing is actually transparent) and checks the result.
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/pil"
          "$RUNNER_TEMP/pil/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/pil/bin/python" - <<'PY'
          import glob
          from PIL import Image
          files = sorted(glob.glob("AppStore/*/*.png"))
          for path in files:
              im = Image.open(path)
              if im.mode != "RGB":
                  base = Image.new("RGB", im.size, (13, 16, 24))
                  rgba = im.convert("RGBA")
                  base.paste(rgba, mask=rgba.getchannel("A"))
                  base.save(path, "PNG", optimize=True)
              im = Image.open(path)
              assert im.mode == "RGB", f"{path} is still {im.mode}"
              print(f"{path}: {im.size[0]} x {im.size[1]} {im.mode}")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: |
            AppStore/iphone-6.9/
            AppStore/iphone-6.3/
            AppStore/iphone-raw/
            AppStore/watch/
          retention-days: 30

  duo:
    # iPhone Duo (the foldable): the same capture, which needs an iOS 27.1+ runtime. The
    # simulator boots closed, so the shots come from the outer display at its App Store
    # size, 1398 x 2034. Apple has no simctl or XCTest way to open it, so there are no
    # inner-display (2007 x 2853) shots yet. Its own job so a missing runtime or device never holds up the
    # iPhone and Watch set.
    name: iPhone Duo screenshots
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'app-store-screenshots')
    runs-on: xcode-27
    timeout-minutes: 100
    env:
      RAW: ${{ github.workspace }}/AppStore/duo-raw
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          [[ -n "$XCODE" ]] || { echo "::error::No Xcode 27 on this runner"; exit 1; }
          sudo xcode-select -switch "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Boot the iPhone Duo simulator at 9:41, in dark appearance
        timeout-minutes: 40
        run: |
          echo "Duo device types:"; xcrun simctl list devicetypes | grep -i duo || true
          echo "iOS runtimes:"; xcrun simctl list runtimes | grep -i ios || true
          boot_duo() {
            TYPE=$(xcrun simctl list devicetypes -j \
              | jq -r '[.devicetypes[] | select(.name | test("Duo"))] | last | .identifier // empty')
            [[ -n "$TYPE" ]] || return 1
            RUNTIME=$(xcrun simctl list runtimes -j \
              | jq -r --arg t "$TYPE" '[.runtimes[] | select(.platform == "iOS" and .isAvailable and any(.supportedDeviceTypes[]?; .identifier == $t))] | last | .identifier // empty')
            [[ -n "$RUNTIME" ]] || return 1
            UDID=$(xcrun simctl list devices available -j \
              | jq -r --arg rt "$RUNTIME" --arg t "$TYPE" '(.devices[$rt] // []) | map(select(.deviceTypeIdentifier == $t)) | .[0].udid // empty')
            [[ -n "$UDID" ]] || UDID=$(xcrun simctl create "iPhone Duo (screenshots)" "$TYPE" "$RUNTIME") || return 1
            xcrun simctl boot "$UDID" || true   # fails harmlessly when already booted
            xcrun simctl bootstatus "$UDID" -b || return 1
          }
          # As with the Watch, a listed runtime may have no files behind it, so a boot is
          # the real check; fetch the iOS platform once if it fails.
          if ! boot_duo; then
            echo "No bootable iPhone Duo simulator; downloading the iOS platform."
            xcodebuild -downloadPlatform iOS
            boot_duo || { echo "::error::No bootable iPhone Duo simulator on this runner"; xcrun simctl list devicetypes; exit 1; }
          fi
          echo "DUO_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active \
            --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Capture iPhone Duo screens
        run: |
          set -o pipefail
          mkdir -p "$RAW"
          TEST_RUNNER_APP_STORE_CAPTURE_DIR="$RAW" xcodebuild test \
            -scheme Stride \
            -destination "platform=iOS Simulator,id=$DUO_UDID" \
            -derivedDataPath DerivedData \
            -only-testing:StrideUITests/AppStoreScreenshotTests \
            -resultBundlePath AppStore/duo.xcresult \
            -skipMacroValidation -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          # The closed device's outer display; anything else means the simulator changed.
          for f in "$RAW"/*.png; do
            size=$(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {print $2}' | paste -sd x -)
            [[ "$size" == "1398x2034" ]] || { echo "::error::$f is $size, not the outer display's 1398x2034"; exit 1; }
          done

      - name: Frame the iPhone Duo screens
        run: |
          cd design/appstore
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install webkit
          node compose.mjs "$RAW" "$GITHUB_WORKSPACE/AppStore/duo-outer" webkit duo-outer

      - name: Flatten every screenshot to RGB, no alpha
        # Same reason as the iPhone job: App Store Connect rejects alpha.
        if: always()
        run: |
          python3 -m venv "$RUNNER_TEMP/pil"
          "$RUNNER_TEMP/pil/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/pil/bin/python" - <<'PY'
          import glob
          from PIL import Image
          for path in sorted(glob.glob("AppStore/*/*.png")):
              im = Image.open(path)
              if im.mode != "RGB":
                  base = Image.new("RGB", im.size, (13, 16, 24))
                  rgba = im.convert("RGBA")
                  base.paste(rgba, mask=rgba.getchannel("A"))
                  base.save(path, "PNG", optimize=True)
              im = Image.open(path)
              assert im.mode == "RGB", f"{path} is still {im.mode}"
              print(f"{path}: {im.size[0]} x {im.size[1]} {im.mode}")
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots-duo
          path: |
            AppStore/duo-outer/
            AppStore/duo-raw/
          retention-days: 30
