name: App Store listing

# Uploads the version's App Store listing by API: What's New and promotional text from
# fastlane/metadata/en-US, and, when given an App Store screenshots run, its framed
# 6.9" iPhone set (App Store Connect scales it for the smaller iPhones). Creates the
# version in App Store Connect if it isn't there. Never uploads a build and never
# submits for review. Run by hand from the Actions tab.
#
# Needs three repository secrets from an App Store Connect API key (App Manager role):
#   ASC_KEY_ID     the key's ID
#   ASC_ISSUER_ID  the issuer ID shown above the keys list
#   ASC_KEY_P8     the contents of the downloaded AuthKey_<id>.p8 file

on:
  workflow_dispatch:
    inputs:
      screenshots_run_id:
        description: "ID of an 'App Store screenshots' run to take the 6.9\" iPhone set from (the number in its URL). Leave empty to keep the current screenshots."
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  listing:
    name: Upload the App Store listing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      RUN_ID: ${{ inputs.screenshots_run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the API key secrets
        run: |
          missing=()
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}. See the comment at the top of this workflow."
            exit 1
          fi

      - name: Read the version
        run: |
          VERSION=$(sed -n 's/^MARKETING_VERSION *= *//p' ci_scripts/Version.xcconfig | tr -d '[:space:]')
          [[ -n "$VERSION" ]] || { echo "::error::No MARKETING_VERSION in ci_scripts/Version.xcconfig"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Uploading the listing for $VERSION"

      - name: Download the screenshots
        if: inputs.screenshots_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: app-store-screenshots
          run-id: ${{ inputs.screenshots_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/app-store-screenshots

      - name: Stage the 6.9" iPhone set
        if: inputs.screenshots_run_id != ''
        run: |
          SRC="$RUNNER_TEMP/app-store-screenshots/iphone-6.9"
          DEST="$RUNNER_TEMP/screenshots/en-US"
          ls "$SRC"/*.png >/dev/null 2>&1 || { echo "::error::No iphone-6.9 PNGs in run $RUN_ID's artifact"; exit 1; }
          mkdir -p "$DEST"
          cp "$SRC"/*.png "$DEST"/
          ls -l "$DEST"
          echo "SCREENSHOTS=$RUNNER_TEMP/screenshots" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload to App Store Connect
        run: fastlane ios listing version:"$VERSION" screenshots:"${SCREENSHOTS:-}"
