name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Stride
  SIMULATOR: iPhone 17
  IOS_VERSION: "27.0"
  # NOTE ON THE macOS RUNNER LABELS (repeated on each macOS job, since `runs-on`
  # cannot read the `env` context and so has to carry the literal):
  #
  # `macos-27` never existed and never will: GitHub stopped naming macOS images
  # after the OS and now names them after the major Xcode version, one Xcode per
  # image. Jobs labelled `macos-27` were never assigned a runner (`runner_id: 0`)
  # and sat queued until GitHub timed them out — run 30050008858's test job waited
  # exactly 24 hours before being cancelled. Falling back to `macos-26` got jobs
  # scheduled again, but that image has no Xcode 27, so "Select Xcode" failed
  # inside the first minute and the iOS tests still never ran.
  #
  # The label that does exist is `xcode-27` (arm64 only; `xcode-27-xlarge` for the
  # larger runner). It carries Xcode 27.0 beta, the iphonesimulator27.0 SDK, and
  # an iPhone 17 on iOS 27.0 — the SIMULATOR/IOS_VERSION pinned above. It is in
  # public preview, so if a job here starts failing to provision, that is the
  # thing to check first:
  #   https://github.com/actions/runner-images/blob/main/images/macos/xcode-27-Readme.md
  #
  # Lint deliberately stays on `macos-26`. It needs SwiftLint and nothing else,
  # and the version pin below was calibrated against that image — a different
  # image pouring a different SwiftLint would hard-fail lint, which gates
  # test-ios, and put us straight back to no macOS job running at all.

  # Stop Homebrew from refreshing its formula index mid-job: without this, two
  # steps in the same run — or the lint and test jobs of the same commit — can
  # resolve different versions of the same tool.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Exact versions the pipeline is known to work with. When set, the install steps
  # fail loudly if Homebrew resolves anything else, so a toolchain bump becomes a
  # deliberate commit rather than a silent change under the build. Leave empty to
  # accept whatever Homebrew provides.
  #
  # SwiftLint is pinned to the version the lint job actually resolved on the
  # macOS runner (Homebrew poured swiftlint 0.65.1 on `macos-26` on 2026-10-16). XcodeGen and
  # xcbeautify have no observed value yet: their install step lives in the test
  # job, which never got as far as running while the labels were wrong (see the
  # runner-label note above). Fill these two in from the first run that reaches
  # "Install XcodeGen and xcbeautify" (N31).
  SWIFTLINT_VERSION: "0.65.1"
  XCODEGEN_VERSION: ""
  XCBEAUTIFY_VERSION: ""

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'Stride/**'
              - 'StrideWatch/**'
              - 'StrideTests/**'
              - 'StrideUITests/**'
              - 'project.yml'
              - 'ci_scripts/**'
              - '.github/workflows/ci.yml'

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (SwiftLint)
    runs-on: macos-26      # see the runner-label note in `env` above
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Swift files
        id: swift_changes
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            swift:
              - added|modified: '**/*.swift'

      - name: Install SwiftLint
        if: github.event_name != 'pull_request' || steps.swift_changes.outputs.swift == 'true'
        run: |
          brew install swiftlint
          installed=$(swiftlint version)
          echo "swiftlint $installed"
          if [[ -n "$SWIFTLINT_VERSION" && "$installed" != "$SWIFTLINT_VERSION" ]]; then
            echo "::error::SwiftLint $installed does not match the pinned SWIFTLINT_VERSION=$SWIFTLINT_VERSION."
            exit 1
          fi

      - name: Run SwiftLint
        if: github.event_name != 'pull_request' || steps.swift_changes.outputs.swift == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            swiftlint lint --reporter github-actions-logging ${{ steps.swift_changes.outputs.swift_files }}
            exit $?
          fi

          swiftlint lint --reporter github-actions-logging

  # ── Build & Test (iOS) ──────────────────────────────────────────────────────
  test-ios:
    name: Test — iOS
    runs-on: xcode-27      # see the runner-label note in `env` above
    timeout-minutes: 60
    # Deliberately NOT `needs: lint`. Lint gating tests bought nothing — a lint
    # failure and a test failure are independent facts about the same commit, and
    # both are wanted on the first run rather than one after the other — while
    # costing every push the lint job's Homebrew install plus a whole-repository
    # SwiftLint pass before the test job was even scheduled. They now run in
    # parallel; `archive` still requires both, so nothing unlinted can ship.
    needs: [changes]
    if: needs.changes.outputs.ios == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 27 toolchain found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        run: |
          brew install xcodegen xcbeautify
          xcodegen_installed=$(xcodegen --version | awk '{print $NF}')
          xcbeautify_installed=$(xcbeautify --version)
          echo "xcodegen $xcodegen_installed"
          echo "xcbeautify $xcbeautify_installed"
          if [[ -n "$XCODEGEN_VERSION" && "$xcodegen_installed" != "$XCODEGEN_VERSION" ]]; then
            echo "::error::XcodeGen $xcodegen_installed does not match the pinned XCODEGEN_VERSION=$XCODEGEN_VERSION."
            exit 1
          fi
          if [[ -n "$XCBEAUTIFY_VERSION" && "$xcbeautify_installed" != "$XCBEAUTIFY_VERSION" ]]; then
            echo "::error::xcbeautify $xcbeautify_installed does not match the pinned XCBEAUTIFY_VERSION=$XCBEAUTIFY_VERSION."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Swift package pins
        run: |
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Keyed on the commit, not on `project.yml`. A key that only moves when
          # `project.yml` does is an *exact* hit on nearly every run, and an exact hit
          # is precisely when actions/cache skips writing the cache back — so the entry
          # froze at whatever the tree looked like the first time that key was minted
          # while the sources kept moving away from it, and the "incremental" build
          # rebuilt more each week. A per-commit key never hits exactly, so every run
          # restores the newest prefix match and saves a fresh entry on top of it.
          key: deriveddata-ios-${{ github.sha }}
          restore-keys: |
            deriveddata-ios-

      - name: Boot simulator
        run: |
          # Prefer the pinned iOS runtime, but fall back to any available iOS
          # runtime that hosts the named device so a runner-image bump (e.g.
          # iOS 27.0 -> 27.1) does not fail the pipeline.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg name "$SIMULATOR" --arg os "com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}" \
              '.devices[$os][]? | select(.name == $name) | .udid' \
            | head -1)
          if [[ -z "$UDID" ]]; then
            echo "::warning::No '$SIMULATOR' simulator for the pinned iOS $IOS_VERSION runtime; falling back to any available iOS runtime."
            UDID=$(xcrun simctl list devices available -j \
              | jq -r --arg name "$SIMULATOR" \
                '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == $name)] | .[0].udid // empty')
          fi
          if [[ -z "$UDID" ]]; then
            echo "::error::No available simulator named '$SIMULATOR' for any iOS runtime was found."
            echo "Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          # Boot is best-effort: the simulator may already be in Booted state.
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        # `-skipMacroValidation` / `-skipPackagePluginValidation`: both are interactive
        #   trust prompts for package plugins, which on a non-interactive runner are
        #   answered by a default rather than by anyone.
        # `COMPILER_INDEX_STORE_ENABLE=NO`: index-while-building exists to feed Xcode's
        #   editor. Nothing on a runner opens the index.
        #
        # `-disableAutomaticPackageResolution` is deliberately NOT here despite the pins
        # being copied in above: on a cold DerivedData the Pulse checkout does not exist
        # yet, and the flag has been observed to turn that first fetch into a "missing
        # package product" failure. The pins already constrain the versions.
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run unit tests
        continue-on-error: true
        run: |
          mkdir -p TestResults
          set -o pipefail
          set +e
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -only-testing:StrideTests \
            -resultBundlePath TestResults/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          status=$?
          echo "$status" > TestResults/unit.exit
          exit "$status"

      - name: Run UI tests
        continue-on-error: true
        run: |
          mkdir -p TestResults
          set -o pipefail
          set +e
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -only-testing:StrideUITests \
            -resultBundlePath TestResults/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          status=$?
          echo "$status" > TestResults/ui.exit
          exit "$status"

      # xcbeautify keeps only a failing UI test's message, which for a snapshot timeout
      # does not say which step hung. Print each failing test's step trace so the log
      # alone is enough to tell.
      - name: Print failing UI test steps
        if: always()
        continue-on-error: true
        run: |
          [[ -d TestResults/ui.xcresult ]] || exit 0
          [[ "$(cat TestResults/ui.exit 2>/dev/null)" == "0" ]] && exit 0
          xcrun xcresulttool get test-results tests --path TestResults/ui.xcresult > /tmp/ui-tests.json
          ids=$(jq -r '.. | objects | select(.nodeType? == "Test Case" and .result? == "Failed") | .nodeIdentifier' /tmp/ui-tests.json)
          for id in $ids; do
            echo "::group::Steps of $id"
            xcrun xcresulttool get test-results activities --test-id "$id" --path TestResults/ui.xcresult \
              | jq -r '.. | objects | select(has("title")) | "\(.startTime // "") \(.title)"'
            echo "::endgroup::"
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios
          path: TestResults/
          retention-days: 7

      - name: Fail if tests failed
        if: always()
        run: |
          unit_status=$(cat TestResults/unit.exit 2>/dev/null || echo 1)
          ui_status=$(cat TestResults/ui.exit 2>/dev/null || echo 1)

          if [[ "$unit_status" != "0" || "$ui_status" != "0" ]]; then
            echo "::error::Unit tests exited with $unit_status; UI tests exited with $ui_status."
            exit 1
          fi

  # ── Build (Release configuration) ───────────────────────────────────────────
  build-release:
    name: Build — Release config
    runs-on: xcode-27      # see the runner-label note in `env` above
    timeout-minutes: 60
    # Parallel with test-ios, for the reason lint is parallel with it: a Release
    # break and a test failure are independent facts about the same commit.
    #
    # WHY THIS JOB EXISTS. `test-ios` compiles the Debug configuration and nothing
    # else, and `archive` — the only thing that ever built Release — is gated on
    # `push` to `main`. So a declaration that exists only in Debug compiled clean
    # through every PR check and then failed the archive *after* merge. The live
    # example is `pccStatus` in `SettingsView`: a `@State` inside the view's
    # `#if DEBUG` block, read by the AI Coach card, which ships in Release. Debug
    # builds saw the declaration, Release builds did not, and the archive stopped
    # at "Cannot find 'pccStatus' in scope". This job compiles Release on the same
    # events the tests run on, so that class of break is a red PR check instead.
    needs: [changes]
    # Skipped on pushes to `main`, where `archive` already builds Release for real.
    if: >-
      needs.changes.outputs.ios == 'true' &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 27 toolchain found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"

      - name: Install XcodeGen and xcbeautify
        run: |
          brew install xcodegen xcbeautify
          xcodegen_installed=$(xcodegen --version | awk '{print $NF}')
          xcbeautify_installed=$(xcbeautify --version)
          echo "xcodegen $xcodegen_installed"
          echo "xcbeautify $xcbeautify_installed"
          if [[ -n "$XCODEGEN_VERSION" && "$xcodegen_installed" != "$XCODEGEN_VERSION" ]]; then
            echo "::error::XcodeGen $xcodegen_installed does not match the pinned XCODEGEN_VERSION=$XCODEGEN_VERSION."
            exit 1
          fi
          if [[ -n "$XCBEAUTIFY_VERSION" && "$xcbeautify_installed" != "$XCBEAUTIFY_VERSION" ]]; then
            echo "::error::xcbeautify $xcbeautify_installed does not match the pinned XCBEAUTIFY_VERSION=$XCBEAUTIFY_VERSION."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Swift package pins
        run: |
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          # Its own cache namespace: Debug-for-simulator and Release-for-device
          # share no build products, so pointing this at the test job's entry would
          # restore megabytes nothing here can reuse. Per-commit key for the same
          # reason as the other two caches above.
          key: deriveddata-release-${{ github.sha }}
          path: ~/Library/Developer/Xcode/DerivedData
          restore-keys: |
            deriveddata-release-

      - name: Build (Release, unsigned)
        # `generic/platform=iOS` rather than a simulator destination: the archive
        # builds for device, and a configuration check that built for the simulator
        # would miss anything gated on the device SDK. Same flags as `archive`
        # below, minus the archiving itself — this job exists to compile, not to
        # produce an artifact.
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  # ── Archive (release build) ─────────────────────────────────────────────────
  archive:
    name: Archive
    runs-on: xcode-27      # see the runner-label note in `env` above
    timeout-minutes: 60
    needs: [changes, lint, test-ios]
    # Only archive on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 27 toolchain found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"

      - name: Install XcodeGen and xcbeautify
        run: |
          brew install xcodegen xcbeautify
          xcodegen_installed=$(xcodegen --version | awk '{print $NF}')
          xcbeautify_installed=$(xcbeautify --version)
          echo "xcodegen $xcodegen_installed"
          echo "xcbeautify $xcbeautify_installed"
          if [[ -n "$XCODEGEN_VERSION" && "$xcodegen_installed" != "$XCODEGEN_VERSION" ]]; then
            echo "::error::XcodeGen $xcodegen_installed does not match the pinned XCODEGEN_VERSION=$XCODEGEN_VERSION."
            exit 1
          fi
          if [[ -n "$XCBEAUTIFY_VERSION" && "$xcbeautify_installed" != "$XCBEAUTIFY_VERSION" ]]; then
            echo "::error::xcbeautify $xcbeautify_installed does not match the pinned XCBEAUTIFY_VERSION=$XCBEAUTIFY_VERSION."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Swift package pins
        run: |
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          # Per-commit for the same reason as the test job's cache above.
          key: deriveddata-archive-${{ github.sha }}
          restore-keys: |
            deriveddata-archive-

      - name: Archive (no signing)
        # No `SKIP_INSTALL=NO` here. A command-line build setting applies to every
        # target in the scheme, so it also overrode `SKIP_INSTALL: YES` on
        # StrideWidgets and dropped the extension at the archive's Products root
        # alongside the app — an archive shape that export rejects. The app target
        # already installs by default; the extension must not.
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/Stride.xcarchive \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Generate TestFlight notes
        run: |
          # Commits since last tag (fall back to last 20 if no tags exist).
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          COMMITS=$(git log "$RANGE" --pretty=format:"• %s" --no-merges 2>/dev/null || echo "")
          [ -z "$COMMITS" ] && COMMITS="• $(git rev-parse --short HEAD)"
          printf 'Build %s (%s)\n\nWhat'"'"'s changed:\n%s\n' \
            "${{ github.run_number }}" \
            "${{ github.ref_name }}" \
            "$COMMITS" > testflight_notes.txt
          echo "=== TestFlight Notes ==="
          cat testflight_notes.txt

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Stride-archive-${{ github.sha }}
          path: build/Stride.xcarchive
          retention-days: 14

      - name: Upload TestFlight notes
        uses: actions/upload-artifact@v4
        with:
          name: testflight-notes-${{ github.sha }}
          path: testflight_notes.txt
          retention-days: 14
