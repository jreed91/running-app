name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Stride
  SIMULATOR: iPhone 17
  IOS_VERSION: "27.0"
  # NOTE ON THE macOS RUNNER LABEL (repeated on each macOS job, since `runs-on`
  # cannot read the `env` context and so has to carry the literal):
  #
  # Every macOS job runs on `macos-26`, not `macos-27`. `macos-27` does not
  # provision — jobs labelled with it are never assigned a runner (`runner_id: 0`)
  # and sit queued until GitHub times them out. Run 30050008858's test job waited
  # exactly 24 hours before being cancelled; once lint moved to the same label it
  # began queueing for hours as well and was cancelled by the next push's
  # concurrency group. Between those two changes no macOS job of any kind ran, so
  # nothing has been linted, built, tested, or archived since. `macos-26` is
  # assigned in seconds, and it is the image that poured the pinned SwiftLint
  # 0.65.0 below.
  #
  # If the toolchain this project needs only ships on a newer image, the fix is a
  # label that exists — not this one. "Select Xcode" already fails loudly, inside
  # the first minute, when the image carries no Xcode 27.
  # Stop Homebrew from refreshing its formula index mid-job: without this, two
  # steps in the same run — or the lint and test jobs of the same commit — can
  # resolve different versions of the same tool.
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Exact versions the pipeline is known to work with. When set, the install steps
  # fail loudly if Homebrew resolves anything else, so a toolchain bump becomes a
  # deliberate commit rather than a silent change under the build. Leave empty to
  # accept whatever Homebrew provides.
  #
  # SwiftLint is pinned to the version the lint job actually resolved on the
  # macOS runner (Homebrew poured swiftlint 0.65.0 on `macos-26`). XcodeGen and
  # xcbeautify have no observed value yet: their install step lives in the test
  # job, which is gated on `needs: lint`, and no macOS job has been scheduled at
  # all while the labels pointed at `macos-27` (see the runner-label note below).
  # Fill these two in from the first run that reaches "Install XcodeGen and
  # xcbeautify" (N31).
  SWIFTLINT_VERSION: "0.65.0"
  XCODEGEN_VERSION: ""
  XCBEAUTIFY_VERSION: ""

jobs:
  # ── Change detection ────────────────────────────────────────────────────────
  changes:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.filter.outputs.ios }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            ios:
              - 'Stride/**'
              - 'StrideTests/**'
              - 'StrideUITests/**'
              - 'project.yml'
              - 'ci_scripts/**'
              - '.github/workflows/ci.yml'

  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (SwiftLint)
    runs-on: macos-26      # see the runner-label note in `env` above
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed Swift files
        id: swift_changes
        uses: dorny/paths-filter@v4
        with:
          list-files: shell
          filters: |
            swift:
              - added|modified: '**/*.swift'

      - name: Install SwiftLint
        if: github.event_name != 'pull_request' || steps.swift_changes.outputs.swift == 'true'
        run: |
          brew install swiftlint
          installed=$(swiftlint version)
          echo "swiftlint $installed"
          if [[ -n "$SWIFTLINT_VERSION" && "$installed" != "$SWIFTLINT_VERSION" ]]; then
            echo "::error::SwiftLint $installed does not match the pinned SWIFTLINT_VERSION=$SWIFTLINT_VERSION."
            exit 1
          fi

      - name: Run SwiftLint
        if: github.event_name != 'pull_request' || steps.swift_changes.outputs.swift == 'true'
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            swiftlint lint --reporter github-actions-logging ${{ steps.swift_changes.outputs.swift_files }}
            exit $?
          fi

          swiftlint lint --reporter github-actions-logging

  # ── Build & Test (iOS) ──────────────────────────────────────────────────────
  test-ios:
    name: Test — iOS
    runs-on: macos-26      # see the runner-label note in `env` above
    timeout-minutes: 60
    needs: [changes, lint]
    if: needs.changes.outputs.ios == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 27 toolchain found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        run: |
          brew install xcodegen xcbeautify
          xcodegen_installed=$(xcodegen --version | awk '{print $NF}')
          xcbeautify_installed=$(xcbeautify --version)
          echo "xcodegen $xcodegen_installed"
          echo "xcbeautify $xcbeautify_installed"
          if [[ -n "$XCODEGEN_VERSION" && "$xcodegen_installed" != "$XCODEGEN_VERSION" ]]; then
            echo "::error::XcodeGen $xcodegen_installed does not match the pinned XCODEGEN_VERSION=$XCODEGEN_VERSION."
            exit 1
          fi
          if [[ -n "$XCBEAUTIFY_VERSION" && "$xcbeautify_installed" != "$XCBEAUTIFY_VERSION" ]]; then
            echo "::error::xcbeautify $xcbeautify_installed does not match the pinned XCBEAUTIFY_VERSION=$XCBEAUTIFY_VERSION."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Swift package pins
        run: |
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-ios-${{ hashFiles('project.yml') }}
          restore-keys: |
            deriveddata-ios-

      - name: Boot simulator
        run: |
          # Prefer the pinned iOS runtime, but fall back to any available iOS
          # runtime that hosts the named device so a runner-image bump (e.g.
          # iOS 27.0 -> 27.1) does not fail the pipeline.
          UDID=$(xcrun simctl list devices available -j \
            | jq -r --arg name "$SIMULATOR" --arg os "com.apple.CoreSimulator.SimRuntime.iOS-${IOS_VERSION//./-}" \
              '.devices[$os][]? | select(.name == $name) | .udid' \
            | head -1)
          if [[ -z "$UDID" ]]; then
            echo "::warning::No '$SIMULATOR' simulator for the pinned iOS $IOS_VERSION runtime; falling back to any available iOS runtime."
            UDID=$(xcrun simctl list devices available -j \
              | jq -r --arg name "$SIMULATOR" \
                '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name == $name)] | .[0].udid // empty')
          fi
          if [[ -z "$UDID" ]]; then
            echo "::error::No available simulator named '$SIMULATOR' for any iOS runtime was found."
            echo "Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          # Boot is best-effort: the simulator may already be in Booted state.
          xcrun simctl boot "$UDID" || true

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Run unit tests
        continue-on-error: true
        run: |
          mkdir -p TestResults
          set -o pipefail
          set +e
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -only-testing:StrideTests \
            -resultBundlePath TestResults/unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          status=$?
          echo "$status" > TestResults/unit.exit
          exit "$status"

      - name: Run UI tests
        continue-on-error: true
        run: |
          mkdir -p TestResults
          set -o pipefail
          set +e
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            -only-testing:StrideUITests \
            -resultBundlePath TestResults/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
          status=$?
          echo "$status" > TestResults/ui.exit
          exit "$status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ios
          path: TestResults/
          retention-days: 7

      - name: Fail if tests failed
        if: always()
        run: |
          unit_status=$(cat TestResults/unit.exit 2>/dev/null || echo 1)
          ui_status=$(cat TestResults/ui.exit 2>/dev/null || echo 1)

          if [[ "$unit_status" != "0" || "$ui_status" != "0" ]]; then
            echo "::error::Unit tests exited with $unit_status; UI tests exited with $ui_status."
            exit 1
          fi

  # ── Archive (release build) ─────────────────────────────────────────────────
  archive:
    name: Archive
    runs-on: macos-26      # see the runner-label note in `env` above
    timeout-minutes: 60
    needs: [changes, test-ios]
    # Only archive on pushes to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [[ -z "$XCODE" ]]; then
            echo "::error::No Xcode 27 toolchain found on this runner. Installed Xcodes:"
            ls -d /Applications/Xcode_*.app 2>/dev/null || true
            exit 1
          fi
          echo "Using $XCODE"
          sudo xcode-select -switch "$XCODE"

      - name: Install XcodeGen and xcbeautify
        run: |
          brew install xcodegen xcbeautify
          xcodegen_installed=$(xcodegen --version | awk '{print $NF}')
          xcbeautify_installed=$(xcbeautify --version)
          echo "xcodegen $xcodegen_installed"
          echo "xcbeautify $xcbeautify_installed"
          if [[ -n "$XCODEGEN_VERSION" && "$xcodegen_installed" != "$XCODEGEN_VERSION" ]]; then
            echo "::error::XcodeGen $xcodegen_installed does not match the pinned XCODEGEN_VERSION=$XCODEGEN_VERSION."
            exit 1
          fi
          if [[ -n "$XCBEAUTIFY_VERSION" && "$xcbeautify_installed" != "$XCBEAUTIFY_VERSION" ]]; then
            echo "::error::xcbeautify $xcbeautify_installed does not match the pinned XCBEAUTIFY_VERSION=$XCBEAUTIFY_VERSION."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Swift package pins
        run: |
          mkdir -p Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ci_scripts/Package.resolved Stride.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: deriveddata-archive-${{ hashFiles('project.yml') }}
          restore-keys: |
            deriveddata-archive-

      - name: Archive (no signing)
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -archivePath build/Stride.xcarchive \
            -derivedDataPath ~/Library/Developer/Xcode/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SKIP_INSTALL=NO \
            | xcbeautify --renderer github-actions

      - name: Generate TestFlight notes
        run: |
          # Commits since last tag (fall back to last 20 if no tags exist).
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD~20..HEAD"
          fi
          COMMITS=$(git log "$RANGE" --pretty=format:"• %s" --no-merges 2>/dev/null || echo "")
          [ -z "$COMMITS" ] && COMMITS="• $(git rev-parse --short HEAD)"
          printf 'Build %s (%s)\n\nWhat'"'"'s changed:\n%s\n' \
            "${{ github.run_number }}" \
            "${{ github.ref_name }}" \
            "$COMMITS" > testflight_notes.txt
          echo "=== TestFlight Notes ==="
          cat testflight_notes.txt

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Stride-archive-${{ github.sha }}
          path: build/Stride.xcarchive
          retention-days: 14

      - name: Upload TestFlight notes
        uses: actions/upload-artifact@v4
        with:
          name: testflight-notes-${{ github.sha }}
          path: testflight_notes.txt
          retention-days: 14
