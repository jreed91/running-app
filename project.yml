name: Stride

options:
  bundleIdPrefix: com.running.stride
  deploymentTarget:
    iOS: "27.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# CURRENT_PROJECT_VERSION and MARKETING_VERSION live in this xcconfig, not in
# `settings.base` below — a project-level build setting overrides an xcconfig, so
# defining them in both places would make the xcconfig inert. CI rewrites the
# build number in the xcconfig instead of rewriting this YAML file.
configFiles:
  Debug: ci_scripts/Version.xcconfig
  Release: ci_scripts/Version.xcconfig

settings:
  base:
    SWIFT_VERSION: 6.2
    SWIFT_STRICT_CONCURRENCY: complete
    # Swift 6.2's "approachable concurrency" bundle. Turns on
    # NonisolatedNonsendingByDefault (a `nonisolated` async function runs on its
    # caller's actor instead of hopping to the global executor),
    # InferSendableFromCaptures, GlobalActorIsolatedTypesUsability, and
    # DisableOutwardActorInference.
    #
    # The behavioural one is the first. It is safe here because this project's
    # `nonisolated` members are delegate callbacks and static pure helpers — the only
    # `nonisolated` *async* work goes through `IntentModelActor`, which carries its own
    # isolation. Anything added later that must not run on the caller's actor should say
    # `@concurrent` explicitly rather than rely on the old implicit hop.
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # NOTE: SWIFT_DEFAULT_ACTOR_ISOLATION is deliberately left at `nonisolated` rather
    # than set to `MainActor`. It is the other half of the Swift 6.2 story and it would
    # delete a good deal of the `@MainActor` bookkeeping in `Core/Services`, but it
    # isolates *every* unannotated type to the main actor — including the 100-plus
    # `Sendable` value types in `Core/Models`, where main-actor isolation and a
    # `Sendable` conformance fight each other. That is a migration with a compiler in
    # the loop, not a build-setting flip.
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  configs:
    Debug:
      # Testability is required for @testable import in unit tests, which run
      # under the Debug config. It is intentionally NOT set in settings.base so
      # Release/archive builds are not compiled with -enable-testing (which
      # disables cross-module optimizations).
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      # `dwarf`, not `dwarf-with-dsym`. This was in `settings.base`, so every Debug
      # build — which is to say every test run, local and CI — ran dsymutil over the
      # app, the widget extension, and both test bundles to produce symbol archives
      # nothing then read: a dSYM exists to symbolicate a crash report from a build
      # you no longer have, which is an archive's problem, not a test bundle's.
      # Debug binaries carry their DWARF inline, so the debugger and the test
      # reporter are unaffected.
      DEBUG_INFORMATION_FORMAT: dwarf
      # Build for the machine running the tests rather than every architecture the
      # simulator SDK supports.
      ONLY_ACTIVE_ARCH: YES
    Release:
      ENABLE_TESTABILITY: NO
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      # The configuration that is actually archived and shipped is the one that needs
      # a dSYM: it is what symbolicates TestFlight and App Store crash reports.
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ONLY_ACTIVE_ARCH: NO

packages:
  Pulse:
    url: https://github.com/kean/Pulse.git
    from: 5.2.1

targets:

  # ── iOS app ──────────────────────────────────────────────────────────────────
  Stride:
    type: application
    platform: iOS
    deploymentTarget: "27.0"

    sources:
      - path: Stride

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride
        PRODUCT_NAME: Stride
        # NOTE: STRIDE_ENABLE_IOS27_MODELS is intentionally NOT defined. The shipping
        # iOS 27 SDK does not expose `PrivateCloudComputeLanguageModel` (build fails
        # with "Cannot find 'PrivateCloudComputeLanguageModel' in scope"), so the
        # Phase 2 Private Cloud Compute path in FoundationModelsCoachBackend stays
        # compiled out until the symbols are verified against a released SDK.
        INFOPLIST_FILE: Stride/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"         # iPhone only
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLOUDKIT_CONTAINER_IDENTIFIER: iCloud.com.running.stride
        # Localization (the last of N18/D8). The compiler extracts every localizable
        # string it can see — `Text("…")` and friends, which take a `LocalizedStringKey`,
        # plus every explicit `String(localized:)` — into `Localizable.xcstrings` on each
        # build. Strings produced outside a view (notifications, spoken accessibility
        # text, alert copy built as a `String`) are only extracted because they now say
        # `String(localized:)`; a bare literal in a `-> String` is invisible to this.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # Expanded into the `aps-environment` entitlement below. Debug builds are
        # signed with a development profile and get a sandbox APNs token; the
        # archive is signed for App Store distribution, whose profile only ever
        # carries `production`. Hardcoding either value breaks the other.
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production

    # Generated by XcodeGen — the file itself is gitignored, this block is the
    # single source of truth. Run `xcodegen generate` after editing.
    entitlements:
      path: Stride/Resources/Stride.entitlements
      properties:
        # NSPersistentCloudKitContainer keeps devices in step with CloudKit silent
        # pushes, which require the push entitlement. Declaring the
        # `remote-notification` background mode without it meant those pushes were
        # never delivered and sync only caught up when the app was foregrounded (M22).
        #
        # The VALUE is per-configuration and must not be hardcoded here. An App Store
        # distribution profile carries `aps-environment: production`; a binary built
        # with `development` does not match it, and the Xcode Cloud archive fails at
        # "Exporting for App Store Distribution" with a code-signing error. XcodeGen
        # writes one `entitlements.properties` block for every configuration, so the
        # per-config split lives in `APS_ENVIRONMENT` below — entitlements files are
        # run through build-setting expansion at packaging time (the same mechanism
        # that resolves `$(TeamIdentifierPrefix)` further down), so the archive gets
        # `production` and local Debug builds keep a development APNs token.
        #
        # REQUIRES the Push Notifications capability on the `com.running.stride`
        # App ID — automatic signing cannot issue a profile for this entitlement
        # otherwise, and signed builds (archive / Xcode Cloud) will fail.
        aps-environment: $(APS_ENVIRONMENT)
        # The app is the only writer of the widgets' data (B1). A widget extension runs
        # in its own process with its own container, so this group is the only channel
        # between the two — see `WidgetSnapshot.swift`.
        #
        # REQUIRES the group to be registered at
        # https://developer.apple.com/account/resources/identifiers → App Groups AND the
        # App Groups capability enabled on *both* App IDs (`com.running.stride` and
        # `com.running.stride.StrideWidgets`). Automatic signing cannot create an App
        # Group, and Xcode Cloud's signing proxy is read-only, so an unregistered group
        # archives cleanly and then fails export the same way an unregistered bundle
        # identifier does.
        com.apple.security.application-groups:
          - group.com.running.stride
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.running.stride
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.weatherkit: true

    dependencies:
      - sdk: WeatherKit.framework
      - sdk: ActivityKit.framework
      # `WidgetCenter.reloadAllTimelines()` — the app is what tells the widgets their
      # data moved (B1). See `WidgetRefreshService`.
      - sdk: WidgetKit.framework
      # Embeds the widget extension in the app bundle. An `ActivityConfiguration` can only
      # be declared by an extension, so the Live Activity (U5b) needs this target — as do
      # the Home Screen / Lock Screen widgets (B1).
      - target: StrideWidgets
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseProxy
      - package: Pulse
        product: PulseUI

    # Generated by XcodeGen — the file itself is gitignored, this block is the
    # single source of truth. Run `xcodegen generate` after editing.
    info:
      path: Stride/Resources/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - location
          - remote-notification
          # Spoken split announcements (U4). A runner locks the phone and puts it in a
          # pocket, so by the time a split closes the app is in the background — without
          # this the audio session cannot be activated there and the announcement is
          # simply lost, which is exactly the case it exists for.
          - audio
        NSLocationWhenInUseUsageDescription: "Stride uses your location to track your route during a run."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Stride uses your location in the background to continue tracking your route."
        NSHealthShareUsageDescription: "Stride reads your workout and heart-rate history to show training insights."
        NSHealthUpdateUsageDescription: "Stride saves your completed runs to Apple Health."
        NSMotionUsageDescription: "Stride uses motion data to measure cadence during runs."
        NSWeatherKitUsageDescription: "Stride uses WeatherKit to record the conditions at the start of your run."
        # The run's Lock Screen / Dynamic Island presence (U5b). Without this key
        # `Activity.request` throws and the run records with no activity at all.
        NSSupportsLiveActivities: true
        # Tapping that Live Activity should land on the run, not just foreground the app.
        # `StrideApp` handles `stride://active-run` by reopening the HUD (U7's minimised
        # run is otherwise only reachable from the tab-bar accessory).
        CFBundleURLTypes:
          - CFBundleURLName: com.running.stride.deeplink
            CFBundleURLSchemes:
              - stride
        # Debug-only, and stripped from every other configuration by the
        # "Strip debug-only Info.plist keys" phase below (S4). Pulse's RemoteLogger —
        # the only thing in the app that touches the local network — is compiled out
        # unless DEBUG is set (`PulseIntegrationService.activateIfNeeded`), so a
        # shipped build that declared these keys was advertising a capability it
        # cannot exercise, and asking App Review to evaluate a permission prompt the
        # user can never see. XcodeGen writes one `info.properties` block for all
        # configurations, hence the build phase rather than a per-config key here.
        NSLocalNetworkUsageDescription: "Stride streams diagnostics to a Pulse console on your local network during development."
        NSBonjourServices:
          - _pulse._tcp
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false

    postBuildScripts:
      - name: Strip debug-only Info.plist keys
        # The bundle's Info.plist is written before this phase and code-signed after
        # it, so editing it here is what ships. Debug keeps the keys: that is the
        # configuration RemoteLogger is compiled into.
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail

          if [ "${CONFIGURATION}" = "Debug" ]; then
            echo "note: Debug build — keeping the Pulse local-network Info.plist keys."
            exit 0
          fi

          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if [ ! -f "${PLIST}" ]; then
            echo "warning: no Info.plist at ${PLIST}; nothing to strip."
            exit 0
          fi

          for KEY in NSLocalNetworkUsageDescription NSBonjourServices; do
            if /usr/libexec/PlistBuddy -c "Print :${KEY}" "${PLIST}" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Delete :${KEY}" "${PLIST}"
              echo "note: removed ${KEY} from the ${CONFIGURATION} Info.plist."
            fi
          done

  # ── Widget extension (Live Activity + Home/Lock Screen widgets) ───────────────
  StrideWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"

    sources:
      - path: StrideWidgets
      # ActivityKit matches the app and the extension on the attributes *type*, so this
      # one file is compiled into both targets rather than duplicated. It is deliberately
      # free of app-only dependencies for that reason.
      - path: Stride/Core/Models/RunActivityAttributes.swift
      # The payload the Home Screen / Lock Screen widgets render (B1), for the same
      # reason: the app writes it, the extension reads it, and two copies of a shared
      # format is how a widget starts drawing a field the app stopped filling in. Also
      # deliberately free of app-only dependencies — Foundation only.
      - path: Stride/Core/Models/WidgetSnapshot.swift
      # A widget bundle cannot read the app's asset catalog, so it carries its own copy —
      # which is what keeps `Color("Brand")` on the Lock Screen the same orange as the app.
      - path: Stride/Resources/Assets.xcassets

    settings:
      base:
        # REQUIRES its own App ID registered at
        # https://developer.apple.com/account/resources/identifiers — an app extension
        # is a separate signed bundle and cannot ride on the app's `com.running.stride`
        # App ID. Xcode Cloud's signing proxy is read-only (every request it forwards
        # carries `X-HTTP-Method-Override: GET`), so automatic signing there can look an
        # App ID up but never create one. Adding this target without registering the
        # identifier first archives fine and then fails every "Exporting for …
        # Distribution" step with:
        #
        #   error: exportArchive Automatic signing cannot register bundle identifier
        #   "com.running.stride.StrideWidgets".
        #   error: exportArchive No profiles for 'com.running.stride.StrideWidgets' were found
        #
        # Since B1 the extension DOES declare an entitlement — the App Group below — so
        # the App ID additionally needs the **App Groups** capability enabled on it, and
        # the group itself registered. Renaming this identifier means registering the new
        # name (and re-enabling the capability) before the next archive.
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride.StrideWidgets
        PRODUCT_NAME: StrideWidgets
        # Set explicitly for the same reason the app target sets it: XcodeGen infers it from
        # the `info:` block below, and stating it keeps the two targets readable side by side.
        INFOPLIST_FILE: StrideWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1"         # iPhone only, like the app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        SKIP_INSTALL: YES
        # The extension has user-facing text of its own ("PAUSED", the metric labels), and
        # it cannot reach the app's catalog, so it extracts into its own.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

    # Generated by XcodeGen — the file itself is gitignored, this block is the
    # single source of truth. Run `xcodegen generate` after editing.
    #
    # The extension's only entitlement, and the only reason it has an entitlements file
    # at all: reading the snapshot the app publishes (B1). It must name the same group the
    # app target does, or the container URL comes back `nil` on one side and the widgets
    # silently render their empty state forever.
    entitlements:
      path: StrideWidgets/StrideWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.running.stride

    # Generated by XcodeGen — the file itself is gitignored, this block is the
    # single source of truth. Run `xcodegen generate` after editing.
    info:
      path: StrideWidgets/Info.plist
      properties:
        CFBundleDisplayName: Stride
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # ── Unit tests ────────────────────────────────────────────────────────────────
  StrideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "27.0"

    sources:
      - StrideTests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: Stride

  # ── UI tests ──────────────────────────────────────────────────────────────────
  StrideUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "27.0"

    sources:
      - StrideUITests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        TEST_TARGET_NAME: Stride
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: Stride

# ── Schemes ───────────────────────────────────────────────────────────────────
schemes:
  Stride:
    build:
      targets:
        Stride: all
        StrideWidgets: all
        StrideTests: [test]
        StrideUITests: [test]
    run:
      config: Debug
      askForAppToLaunch: false
    test:
      config: Debug
      targets:
        - name: StrideTests
          parallelizable: true
          randomExecutionOrder: true
        - name: StrideUITests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
