name: Stride

options:
  bundleIdPrefix: com.running.stride
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.4"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_TESTABILITY: YES
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: "1.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  Pulse:
    url: https://github.com/kean/Pulse.git
    from: 5.2.1

targets:

  # ── iOS app ──────────────────────────────────────────────────────────────────
  Stride:
    type: application
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - path: Stride

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride
        PRODUCT_NAME: Stride
        INFOPLIST_FILE: Stride/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"         # iPhone only
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CLOUDKIT_CONTAINER_IDENTIFIER: iCloud.com.running.stride

    entitlements:
      path: Stride/Resources/Stride.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.running.stride
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.weatherkit: true

    dependencies:
      - sdk: WeatherKit.framework
      - package: Pulse
        product: Pulse
      - package: Pulse
        product: PulseProxy
      - package: Pulse
        product: PulseUI

    info:
      path: Stride/Resources/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - location
          - remote-notification
        NSLocationWhenInUseUsageDescription: "Stride uses your location to track your route during a run."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Stride uses your location in the background to continue tracking your route."
        NSHealthShareUsageDescription: "Stride reads your workout and heart-rate history to show training insights."
        NSHealthUpdateUsageDescription: "Stride saves your completed runs to Apple Health."
        NSMotionUsageDescription: "Stride uses motion data to measure cadence during runs."
        NSWeatherKitUsageDescription: "Stride uses WeatherKit to record the conditions at the start of your run."
        NSLocalNetworkUsageDescription: "Network usage required only for development and TestFlight diagnostics."
        NSBonjourServices:
          - _pulse._tcp
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false

  # ── Unit tests ────────────────────────────────────────────────────────────────
  StrideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - StrideTests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride.tests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: Stride

  # ── UI tests ──────────────────────────────────────────────────────────────────
  StrideUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"

    sources:
      - StrideUITests

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.running.stride.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "VMNPGK3Q29"
        TEST_TARGET_NAME: Stride
        GENERATE_INFOPLIST_FILE: YES

    dependencies:
      - target: Stride

# ── Schemes ───────────────────────────────────────────────────────────────────
schemes:
  Stride:
    build:
      targets:
        Stride: all
        StrideTests: [test]
        StrideUITests: [test]
    run:
      config: Debug
      askForAppToLaunch: false
    test:
      config: Debug
      targets:
        - name: StrideTests
          parallelizable: true
          randomExecutionOrder: true
        - name: StrideUITests
          parallelizable: false
          randomExecutionOrder: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true
